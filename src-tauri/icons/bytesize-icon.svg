  <defs>
    <linearGradient id="backdrop" x1="120" y1="80" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="0.5" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="center" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#243451"/>
      <stop offset="1" stop-color="#0d1522"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

