[package]
name = "bytesize"
version = "0.1.0"
description = "A fast, visual macOS disk space analyzer"
authors = ["Liam Clark"]
license = "MIT"
repository = "https://github.com/liamclarkza/bytesize"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bytesize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
walkdir = "2.5"
rayon = "1.11"
trash = "5"
fs2 = "0.4"
